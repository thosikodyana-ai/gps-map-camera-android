name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Release Keystore for Signing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=GPS Map Camera, OU=Mobile, O=AIStudio, L=Jakarta, S=DKI, C=ID"
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release & Debug APKs
        env:
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/GPS-Map-Camera-v1.0-release.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/GPS-Map-Camera-v1.0-debug.apk || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: release-artifacts/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "GPS Map Camera v1.0.${{ github.run_number }} (Release APK)"
          body: |
            ## GPS Map Camera (with Custom Timestamp & Interactive Map Picker)
            - **Template 1 (Satellite Brebes Reference Style)** & **Template 2 (Street Map & Sensor µT Reference Style)**
            - **Interactive Map Location Picker** (`manual_map` source lock, reverse geocoding, Plus Code generator)
            - **Custom Date/Time & Timezone Override** (`WIB`, `WITA`, `WIT`, `UTC`) synced to Canvas & EXIF `DateTimeOriginal`
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
