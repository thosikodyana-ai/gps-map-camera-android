name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Keystores for Signing
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=GPS Map Camera, OU=Mobile, O=AIStudio, L=Jakarta, S=DKI, C=ID"
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Release & Debug APKs
        env:
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/GPS-Map-Camera-v1.1.${{ github.run_number }}-release.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/GPS-Map-Camera-v1.1.${{ github.run_number }}-debug.apk || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: release-artifacts/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "GPS Map Camera v1.1.${{ github.run_number }} (Release & Debug APK)"
          body: |
            ## GPS Map Camera v1.1.${{ github.run_number }}
            ### Pembaruan Terbaru:
            - **Perbaikan Penyimpanan Lokasi Manual (OK)**: Lokasi yang dipilih secara manual di peta langsung tersimpan permanen ke state utama dan database Room tanpa tertimpa lokasi lama atau sensor kompas.
            - **Perbaikan Layering & Z-Index Modal Peta**: Struktur 4 bagian (`Header`, `Search Section`, `Map Section` dengan `clipToBounds`, dan `Selected Location Panel`) memastikan peta tidak lagi menutupi kolom pencarian.
            - **Penghapusan Tombol Preset Lokasi**: Menghapus tombol preset referensi (*Brebes*, *Slawi/Tegal*, *Moskva*) di bawah kolom pencarian.
            - **Proporsi Stamp Presisi & Rotasi Foto Manual**: Ukuran mini-map persegi 1:1 dan kartu teks adaptif Portrait/Landscape serta fitur Putar Foto 90° di layar pratinjau.
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
